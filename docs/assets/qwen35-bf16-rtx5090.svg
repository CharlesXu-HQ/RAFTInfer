<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Qwen3.5-9B BF16 throughput on NVIDIA GeForce RTX 5090</title>
  <desc id="description">RAFTInfer and llama.cpp throughput comparison. Values are tokens per second; each group includes the RAFTInfer to llama.cpp ratio.</desc>
  <rect width="1200" height="620" fill="#FFFFFF"/>
  <text x="40" y="46" fill="#0F172A" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start">Qwen3.5-9B BF16 — RTX 5090 throughput</text>
  <text x="40" y="72" fill="#475569" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start">Accepted evidence: RAFTInfer vs llama.cpp; higher is better</text>
